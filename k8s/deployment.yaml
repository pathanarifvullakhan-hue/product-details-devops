apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-details
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-details
  template:
    metadata:
      labels:
        app: product-details
    spec:
      containers:
        - name: product-details
          image: product-details:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
